name: FCC Studio

on:
  push:
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Start fcc-server
        working-directory: server
        run: |
          uv sync
          nohup uv run fcc-server > ../fcc-server.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8082/health && break; sleep 2; done
      - name: Build and test Studio
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e -- --trace off
      - if: failure()
        run: cat fcc-server.log || true
